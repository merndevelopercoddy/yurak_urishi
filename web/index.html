<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>rPPG Yurak Urishi Monitori</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Kamera va overlay -->
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>

      <!-- Sarlavha (tepada) -->
      <div class="cv-title">rPPG Yurak Urishi Monitori</div>

      <!-- FPS -->
      <div class="cv-fps" id="fps-badge">-- fps</div>

      <!-- Asosiy matn (BPM yoki to'planmoqda) -->
      <div class="cv-hr" id="hr-text">Ma'lumot to'planmoqda...</div>

      <!-- Yuz holati -->
      <div class="cv-face" id="face-text"></div>

      <!-- Pastki yordam matni -->
      <div class="cv-hint">R: qayta boshlash &nbsp;|&nbsp; Yuzingizni qimirlatmang</div>

      <!-- Progress paneli -->
      <div class="cv-progress-wrap">
        <span class="cv-progress-label" id="progress-label">Signal: 0%</span>
        <div class="cv-progress-bg">
          <div class="cv-progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- WS holati (ulanmagan bo'lsa) -->
      <div class="cv-ws-status hidden" id="ws-status">Server ulanmoqda...</div>
    </div>

    <!-- Tugma -->
    <div class="btn-wrap">
      <button id="btn-start" class="cv-btn" onclick="App.toggleCamera()">
        Kamerani yoqish
      </button>
      <button class="cv-btn cv-btn-reset" onclick="App.reset()">R</button>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
